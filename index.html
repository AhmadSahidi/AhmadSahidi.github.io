.qnum{font-weight:600;color:var(--muted);flex:1}

.ans.fa{line-height:1.7}

.feedback.bad{background:var(--bad-bg);color:var(--bad)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.grid button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}

.grid button.w{background:var(--bad-bg);border-color:var(--bad)}

.hidden{display:none!important}
</style>

<script>
(function(){
"use strict";
var D=window.LID_DATA, Q=D.questions, IMG=D.images;
var byId={}; Q.forEach(function(q,i){q.idx=i;byId[q.id]=q;});
var GEN=Q.filter(function(q){return q.id.indexOf('HE-')!==0}), HE=Q.filter(function(q){return q.id.indexOf('HE-')===0});
var KEY='lid-hessen-v1';
var st={res:{},stars:{},pos:0,exams:[]};
try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); for(var k in p) st[k]=p[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var $=function(id){return document.getElementById(id)};
var view=$('view'), foot=$('foot'), footIn=$('footIn');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function faNum(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
function label(q){return q.id.indexOf('HE-')===0?'Hessen '+q.id.slice(3):'Frage '+q.id}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function setFoot(html){if(!html){foot.classList.add('hidden');footIn.innerHTML='';return}foot.classList.remove('hidden');footIn.innerHTML=html}
var timerInt=null;
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}$('timer').classList.add('hidden')}
function header(title,showHome){$('title').textContent=title;$('homeBtn').classList.toggle('hidden',!showHome)}
$('homeBtn').onclick=function(){
  if(session&&session.mode==='exam'&&!session.done){confirmBox('Prüfung abbrechen?','آزمون لغو شود؟',function(){stopTimer();home()});return}
  stopTimer();home();
};
function confirmBox(de,fa,yes){
  var r=$('modalRoot');
  r.innerHTML='<div class="modal"><div class="card"><div style="font-weight:600;font-size:19px">'+esc(de)+'</div><div class="fa sub">'+esc(fa)+'</div><div class="row" style="margin-top:14px"><button class="btn sec" id="mNo" style="flex:1">Nein · خیر</button><button class="btn" id="mYes">Ja · بله</button></div></div></div>';
  $('mNo').onclick=function(){r.innerHTML=''};
  $('mYes').onclick=function(){r.innerHTML='';yes()};
}

/* ---------- Home ---------- */
var session=null;
function stats(){
  var seen=0,ok=0,wrong=0;
  Q.forEach(function(q){var r=st.res[q.id]; if(r){seen++; if(r.last) ok++; else wrong++;}});
  return {seen:seen,ok:ok,wrong:wrong,stars:Object.keys(st.stars).filter(function(k){return st.stars[k]}).length};
}
function home(){
  session=null;stopTimer();setFoot('');header('Leben in Deutschland · Hessen',false);window.scrollTo(0,0);
  var s=stats(), pct=Math.round(s.ok/Q.length*100);
  var cont=Math.min(st.pos||0,Q.length-1);
  view.innerHTML=
   '<div class="card"><div class="row"><div style="flex:1"><b>Dein Fortschritt</b><div class="fa sub">پیشرفت شما</div></div><div class="big" style="font-size:28px">'+pct+'%</div></div>'+
   '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
   '<div class="sub">'+s.ok+' von '+Q.length+' Fragen zuletzt richtig · '+s.wrong+' zuletzt falsch</div>'+
   '<div class="sub fa">'+faNum(s.ok)+' از '+faNum(Q.length)+' سؤال آخرین بار درست · '+faNum(s.wrong)+' آخرین بار غلط</div></div>'+
   '<div class="menu">'+
   mbtn('learn','📖','Alle Fragen lernen','همه سؤال‌ها به ترتیب'+(cont>0?' · ادامه از '+faNum(cont+1):''),cont>0?'weiter bei Nr. '+(cont+1):'der Reihe nach, 1 bis 310')+
   mbtn('exam','📝','Prüfung simulieren','آزمون آزمایشی: ۳۳ سؤال، ۶۰ دقیقه','33 Fragen · 60 Minuten · ab 17 richtig bestanden')+
   mbtn('wrong','🔁','Fehler wiederholen','تکرار سؤال‌های غلط',s.wrong+' Fragen')+
   mbtn('random','🎲','Zufällige Fragen','سؤال‌های تصادفی','gemischt aus allen 310')+
   mbtn('hessen','🦁','Nur Hessen-Fragen','فقط سؤال‌های ایالت هسن','10 Fragen')+
   mbtn('stars','⭐','Gemerkte Fragen','سؤال‌های نشان‌شده',s.stars+' Fragen')+
   mbtn('jump','🔢','Zu Frage Nummer …','رفتن به سؤال شماره …','')+
   mbtn('overview','📊','Übersicht aller Fragen','نمای کلی همه سؤال‌ها','grün = richtig, rot = falsch')+
   '</div>'+
   (st.exams&&st.exams.length?'<div class="card"><b>Letzte Prüfungen</b> <span class="fa sub">آزمون‌های اخیر</span><div class="sub">'+st.exams.slice(-5).reverse().map(function(e){return e.date+': '+e.score+'/33 '+(e.score>=17?'✅':'❌')}).join('<br>')+'</div></div>':'')+
   '<div class="card sub" style="font-size:14px">Tipp: Mit dem Knopf <b>DE | فا</b> oben bei jeder Frage zwischen Deutsch und Farsi wechseln. Die Prüfung ist auf Deutsch – erst auf Deutsch lesen, dann bei Bedarf umschalten.<div class="fa" style="margin-top:6px">نکته: با دکمه <b>DE | فا</b> بالای هر سؤال بین آلمانی و فارسی جابه‌جا شوید. آزمون به زبان آلمانی است – اول آلمانی بخوانید، بعد اگر لازم بود فارسی را ببینید.</div><div style="margin-top:8px">Fragenkatalog des BAMF, Stand '+D.stand+'. Farsi-Übersetzung ohne Gewähr.</div>'+
   '<div class="row" style="margin-top:10px"><button class="btn sec" id="resetBtn" style="font-size:14px;min-height:40px;padding:8px 12px">Fortschritt löschen · پاک کردن پیشرفت</button></div></div>';
  view.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){start(b.getAttribute('data-m'))}});
  $('resetBtn').onclick=function(){confirmBox('Wirklich den ganzen Fortschritt löschen?','واقعاً کل پیشرفت پاک شود؟',function(){st={res:{},stars:{},pos:0,exams:[]};save();home()})};
}
function mbtn(m,ic,de,fa,sub){return '<button data-m="'+m+'"><span class="ic">'+ic+'</span><span class="t"><b>'+de+'</b>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'<span class="fa sub">'+fa+'</span></span></button>'}

function start(m){
  if(m==='learn'){practice('learn',Q.map(function(q){return q.idx}),Math.min(st.pos||0,Q.length-1),'Alle Fragen');return}
  if(m==='random'){practice('random',shuffle(Q.map(function(q){return q.idx})),0,'Zufällig');return}
  if(m==='hessen'){practice('hessen',HE.map(function(q){return q.idx}),0,'Hessen');return}
  if(m==='wrong'){var w=Q.filter(function(q){var r=st.res[q.id];return r&&!r.last}).map(function(q){return q.idx});
    if(!w.length){info('Keine falschen Fragen – super! 🎉','هیچ سؤال غلطی نیست – عالی!');return}practice('wrong',w,0,'Fehler');return}
  if(m==='stars'){var s=Q.filter(function(q){return st.stars[q.id]}).map(function(q){return q.idx});
    if(!s.length){info('Noch keine Fragen gemerkt. Tippe bei einer Frage auf ☆.','هنوز سؤالی نشان نشده. در هر سؤال روی ☆ بزنید.');return}practice('stars',s,0,'Gemerkt');return}
  if(m==='exam'){exam();return}
  if(m==='jump'){jump();return}
  if(m==='overview'){overview();return}
}
function info(de,fa){var r=$('modalRoot');r.innerHTML='<div class="modal"><div class="card"><div style="font-size:19px;font-weight:600">'+esc(de)+'</div><div class="fa sub">'+esc(fa)+'</div><div class="row" style="margin-top:14px"><button class="btn" id="mOk">OK</button></div></div></div>';$('mOk').onclick=function(){r.innerHTML=''}}
function jump(){
  var r=$('modalRoot');
  r.innerHTML='<div class="modal"><div class="card"><b>Zu welcher Frage?</b><div class="fa sub">به کدام سؤال برویم؟</div><div class="sub">1–300, Hessen: H1–H10</div><div class="row" style="margin-top:10px"><input id="jn" type="text" inputmode="text" style="font-size:20px;padding:10px;border-radius:10px;border:1px solid var(--line);width:120px;background:var(--card);color:var(--ink)" placeholder="z.B. 42"><button class="btn" id="jGo">Los · برو</button></div><div class="row" style="margin-top:10px"><button class="btn sec" id="jX" style="flex:1">Abbrechen · لغو</button></div></div></div>';
  var inp=$('jn');inp.focus();
  function go(){var v=inp.value.trim().toUpperCase().replace(/\s/g,'');var id=v;
    if(/^H(E)?-?\d+$/.test(v)) id='HE-'+v.replace(/\D/g,'');
    var q=byId[id]; if(!q){inp.style.borderColor='var(--bad)';return}
    r.innerHTML='';practice('learn',Q.map(function(x){return x.idx}),q.idx,'Alle Fragen')}
  $('jGo').onclick=go; inp.onkeydown=function(e){if(e.key==='Enter')go()}; $('jX').onclick=function(){r.innerHTML=''};
}
function overview(){
  session=null;header('Übersicht',true);setFoot('');window.scrollTo(0,0);
  function cells(list){return list.map(function(q){var r=st.res[q.id];var c=r?(r.last?'c':'w'):'';return '<button class="'+c+'" data-i="'+q.idx+'">'+(q.id.indexOf('HE-')===0?'H'+q.id.slice(3):q.id)+'</button>'}).join('')}
  view.innerHTML='<div class="card"><b>Alle Fragen</b> <span class="fa sub">همه سؤال‌ها</span><div class="sub">Grün = zuletzt richtig, Rot = zuletzt falsch. Antippen zum Üben.</div><div class="sub fa">سبز = آخرین بار درست، قرمز = آخرین بار غلط. برای تمرین لمس کنید.</div></div>'+
   '<div class="card"><b>Hessen</b><div class="grid" style="margin-top:8px">'+cells(HE)+'</div></div><div class="card"><b>Allgemein (1–300)</b><div class="grid" style="margin-top:8px">'+cells(GEN)+'</div></div>';
  view.querySelectorAll('.grid button').forEach(function(b){b.onclick=function(){practice('learn',Q.map(function(x){return x.idx}),+b.getAttribute('data-i'),'Alle Fragen')}});
}

/* ---------- Question rendering ---------- */
function renderQ(q,opts){
  var lang=opts.lang, L=lang==='fa'?q.fa:q.de, isFa=lang==='fa';
  var keys=isFa?['۱','۲','۳','۴']:['A','B','C','D'];
  var h='<div class="qhead"><span class="qnum">'+esc(opts.counter)+'</span>'+
    '<span class="toggle" role="group" aria-label="Sprache"><button data-l="de" class="'+(isFa?'':'on')+'">DE</button><button data-l="fa" class="'+(isFa?'on':'')+'" style="font-family:Vazirmatn,Tahoma,sans-serif">فا</button></span>'+
    '<button class="starbtn '+(st.stars[q.id]?'on':'')+'" id="starBtn" aria-label="Merken">'+(st.stars[q.id]?'★':'☆')+'</button></div>';
  h+='<div class="card"><div class="sub">'+esc(label(q))+'</div><div class="qtext '+(isFa?'fa':'')+'" '+(isFa?'dir="rtl" lang="fa"':'')+'>'+esc(L[0])+'</div>';
  if(q.img&&IMG[q.img]) h+='<img class="qimg" alt="Bild zur Frage" src="'+IMG[q.img]+'">';
  h+='</div><div id="answers">';
  for(var i=0;i<4;i++){
    var cls='ans'+(isFa?' fa':'');
    if(opts.reveal){ if(i===q.s) cls+=' ok'; else if(i===opts.chosen) cls+=' bad'; }
    else if(i===opts.chosen) cls+=' sel';
    h+='<button class="'+cls+'" data-a="'+i+'" '+(isFa?'dir="rtl" lang="fa"':'')+'><span class="k">'+keys[i]+'</span><span class="tx">'+esc(L[i+1])+'</span></button>';
  }
  h+='</div>';
  if(opts.reveal){
    var ok=opts.chosen===q.s;
    h+='<div class="feedback '+(ok?'ok':'bad')+'">'+(ok?'✓ Richtig! <span class="fa">· درست است!</span>':'✗ Leider falsch. <span class="fa">· متأسفانه غلط.</span>')+'</div>';
    if(!ok){h+='<div class="card"><div class="sub">Richtige Antwort · <span class="fa">پاسخ درست</span></div><div style="font-weight:600;margin-top:4px">'+esc(q.de[q.s+1])+'</div><div class="fa" style="margin-top:4px">'+esc(q.fa[q.s+1])+'</div></div>'}
  }
  view.innerHTML=h;
  view.querySelectorAll('.toggle button').forEach(function(b){b.onclick=function(){opts.onLang(b.getAttribute('data-l'))}});
  $('starBtn').onclick=function(){st.stars[q.id]=!st.stars[q.id];if(!st.stars[q.id])delete st.stars[q.id];save();this.classList.toggle('on',!!st.stars[q.id]);this.textContent=st.stars[q.id]?'★':'☆'};
  view.querySelectorAll('.ans').forEach(function(b){b.onclick=function(){opts.onAnswer(+b.getAttribute('data-a'))}});
}

/* ---------- Practice ---------- */
function practice(mode,list,pos,title){
  session={mode:mode,list:list,pos:pos,lang:'de',chosen:null,reveal:false,title:title};
  stopTimer();header(title,true);showPractice();
}
function record(q,ok){var r=st.res[q.id]||{c:0,w:0};if(ok)r.c++;else r.w++;r.last=ok;st.res[q.id]=r;save()}
function showPractice(){
  var s=session, q=Q[s.list[s.pos]];
  if(s.mode==='learn'){st.pos=s.pos;save()}
  renderQ(q,{lang:s.lang,chosen:s.chosen,reveal:s.reveal,counter:(s.pos+1)+' / '+s.list.length,
    onLang:function(l){s.lang=l;showPractice()},
    onAnswer:function(i){if(s.reveal)return;s.chosen=i;s.reveal=true;record(q,i===q.s);showPractice()}});
  setFoot('<button class="btn sec" id="prevB" '+(s.pos===0?'disabled':'')+'>‹</button><button class="btn" id="nextB">'+(s.pos===s.list.length-1?'Fertig · پایان':'Weiter · بعدی ›')+'</button>');
  $('prevB').onclick=function(){if(s.pos>0){s.pos--;s.chosen=null;s.reveal=false;s.lang='de';showPractice();window.scrollTo(0,0)}};
  $('nextB').onclick=function(){
    if(s.pos===s.list.length-1){if(s.mode==='learn'){st.pos=0;save()}home();return}
    s.pos++;s.chosen=null;s.reveal=false;s.lang='de';showPractice();window.scrollTo(0,0)};
}

/* ---------- Exam ---------- */
function exam(){
  var list=shuffle(GEN).slice(0,30).concat(shuffle(HE).slice(0,3)).map(function(q){return q.idx});
  session={mode:'exam',list:list,pos:0,lang:'de',answers:new Array(33).fill(null),end:Date.now()+60*60*1000,done:false};
  header('Prüfung',true);
  var t=$('timer');t.classList.remove('hidden');
  function tick(){var ms=session.end-Date.now();if(ms<=0){finishExam();return}var m=Math.floor(ms/60000),sec=Math.floor(ms/1000)%60;t.textContent=m+':'+(sec<10?'0':'')+sec}
  tick();timerInt=setInterval(tick,1000);
  showExam();
}
function showExam(){
  var s=session,q=Q[s.list[s.pos]];
  var answered=s.answers.filter(function(a){return a!==null}).length;
  renderQ(q,{lang:s.lang,chosen:s.answers[s.pos],reveal:false,counter:'Frage '+(s.pos+1)+' von 33 · beantwortet: '+answered,
    onLang:function(l){s.lang=l;showExam()},
    onAnswer:function(i){s.answers[s.pos]=i;showExam()}});
  var last=s.pos===32;
  setFoot('<button class="btn sec" id="prevB" '+(s.pos===0?'disabled':'')+'>‹</button>'+(last?'<button class="btn" id="finB">Abgeben · تحویل</button>':'<button class="btn" id="nextB">Weiter · بعدی ›</button>'));
  $('prevB').onclick=function(){if(s.pos>0){s.pos--;s.lang='de';showExam();window.scrollTo(0,0)}};
  if(last) $('finB').onclick=function(){var open=s.answers.filter(function(a){return a===null}).length;
     if(open) confirmBox(open+' Fragen sind noch offen. Trotzdem abgeben?',faNum(open)+' سؤال هنوز بی‌پاسخ است. با این حال تحویل شود؟',finishExam); else finishExam()};
  else $('nextB').onclick=function(){s.pos++;s.lang='de';showExam();window.scrollTo(0,0)};
}
function finishExam(){
  var s=session;if(s.done)return;s.done=true;stopTimer();
  var score=0;s.list.forEach(function(qi,i){var q=Q[qi];var ok=s.answers[i]===q.s;if(ok)score++;if(s.answers[i]!==null)record(q,ok)});
  var d=new Date();st.exams=(st.exams||[]).concat([{date:d.toLocaleDateString('de-DE'),score:score}]).slice(-20);save();
  header('Ergebnis',true);setFoot('<button class="btn" id="homeB">Zur Startseite · صفحه اصلی</button>');$('homeB').onclick=home;
  var pass=score>=17;window.scrollTo(0,0);
  var h='<div class="card" style="text-align:center"><div class="big" style="color:'+(pass?'var(--ok)':'var(--bad)')+'">'+score+' / 33</div><div style="font-size:21px;font-weight:600">'+(pass?'Bestanden! 🎉':'Nicht bestanden')+'</div><div class="fa" style="text-align:center">'+(pass?'قبول شدید!':'قبول نشدید – باز هم تمرین کنید')+'</div><div class="sub">Zum Bestehen braucht man mindestens 17 richtige Antworten.</div></div>';
  h+='<div class="card list"><b>Auswertung</b> <span class="fa sub">بررسی پاسخ‌ها</span>';
  s.list.forEach(function(qi,i){var q=Q[qi],a=s.answers[i],ok=a===q.s;
    h+='<div class="it"><div class="row"><span class="tag">'+esc(label(q))+'</span><b style="color:'+(ok?'var(--ok)':'var(--bad)')+'">'+(ok?'✓':'✗')+'</b></div><div style="margin-top:4px">'+esc(q.de[0])+'</div>'+
       (ok?'':'<div class="sub">Deine Antwort: '+(a===null?'–':esc(q.de[a+1]))+'</div>')+
       '<div style="color:var(--ok);font-weight:600">'+esc(q.de[q.s+1])+'</div><div class="fa sub">'+esc(q.fa[0])+'<br><b>'+esc(q.fa[q.s+1])+'</b></div></div>'});
  h+='</div>';view.innerHTML=h;
}
